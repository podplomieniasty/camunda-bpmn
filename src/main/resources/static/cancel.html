<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket booking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark-subtle">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Projekt 2024/2025</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="index.html">Bilety</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" aria-current="page" href="cancel.html">Anulowanie</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="mt-5 mx-md-auto mx-5 col-md-4">
    <h1 class="text-center text-primary fw-semibold mb-4">Anuluj rezerwację</h1>
    <form id="cancelReservationForm" class="needs-validation" novalidate>
        <div class="mb-3">
            <label for="accessCode" class="form-label">Kod dostępu:</label>
            <input type="text" class="form-control" id="accessCode" name="accessCode" required />
            <div class="invalid-feedback">Please provide a valid access code.</div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" name="email" required />
            <div class="invalid-feedback">Please provide a valid email address.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">Start Process</button>
    </form>

    <p id="responseMessage" class="text-center mt-4"></p>
</main>

<script src="cancel_script.js"></script>

</body>
</html>
